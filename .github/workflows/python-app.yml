# .github/workflows/python-app.yml

name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v2

      # 2. Set up Python environment
      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      # 3. Cache pip dependencies to speed up builds
      - name: Cache pip dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 5. Install linting and testing tools
      - name: Install Linting and Testing Tools
        run: |
          pip install black flake8 coverage

      # 6. Run linting checks
      - name: Run Linting
        run: |
          # Check code formatting with Black
          black --check backend/
          
          # Check code quality with Flake8
          flake8 backend/

      # 7. Download necessary NLTK data
      - name: Download NLTK Data
        run: |
          python -m nltk.downloader averaged_perceptron_tagger wordnet omw-1.4 punkt

      # 8. Run unit tests with coverage
      - name: Run Unit Tests with Coverage
        run: |
          coverage run -m unittest discover backend/tests
          coverage report

      # 9. Upload coverage report (Optional)
      # Uncomment the following steps if you want to upload the coverage report as an artifact
      # - name: Generate Coverage XML
      #   run: coverage xml

      # - name: Upload Coverage Report
      #   uses: actions/upload-artifact@v2
